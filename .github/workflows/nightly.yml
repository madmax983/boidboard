name: Nightly

# The per-push CI path is deliberately cheap. This is where the expensive checks live:
# the deep perft tier, and a build with the autumn dependencies actually switched on.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  deep-perft:
    name: deep perft replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOIDBOARD_REQUIRE_STOCKFISH: "1"
      # Replay every independently-verified count in the fixture, not just the cheap tier:
      # all 44 'v' rows rather than the 30 that fit the default budget. Roughly 23 billion
      # nodes across the seven positions -- kiwipete d6 alone is 8.0e9 and takes ~57s.
      BOID_PERFT_MAX_NODES: "20000000000"
    steps:
      - uses: actions/checkout@v4
      # Toolchain BEFORE the cache action: rust-cache computes its key from `rustc -vV`,
      # which is itself what triggers the rustup download for the pinned version. Ordered
      # the other way round, the retry script sits downstream of the step that actually
      # fails -- which is exactly how CI run 1 died ("Command failed: rustc -vV").
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/setup-stockfish.sh
      - run: cargo test --workspace -- --nocapture

  # The pin in Cargo.toml is only meaningful if something compiles it. Nothing on the
  # per-push path does, by design (D-0012), so it is proven here instead: a yanked
  # release, a broken 0.6.x, or a missing native dependency surfaces within a day.
  autumn-features:
    name: autumn dependencies, features on
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Toolchain BEFORE the cache action: rust-cache computes its key from `rustc -vV`,
      # which is itself what triggers the rustup download for the pinned version. Ordered
      # the other way round, the retry script sits downstream of the step that actually
      # fails -- which is exactly how CI run 1 died ("Command failed: rustc -vV").
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - name: Install libpq
        # autumn-web's default features reach diesel/postgres. Today pq-sys emits no link
        # directive so nothing needs libpq, but that is latent rather than absent, and one
        # apt line is cheaper than a mystery link failure in issue #16.
        run: sudo apt-get update -qq && sudo apt-get install -y libpq-dev
      - run: cargo build -p boid-web  --features serve
      - run: cargo build -p boid-tune --features orchestrate
      - name: The pin is exercised, not merely declared
        run: |
          set -euo pipefail
          cargo tree -p boid-web  --features serve       -i autumn-web
          cargo tree -p boid-tune --features orchestrate -i autumn-harvest

  cold-cache-locked:
    name: cold-cache locked build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Deliberately no rust-cache: this job exists to prove a clean checkout builds.
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - run: ./scripts/setup-stockfish.sh
      - run: cargo build --workspace --locked
      - name: cargo test --workspace --locked
        # Without REQUIRE the differential tests would skip silently on a cold runner,
        # which would make this job's green tick mean less than it appears to.
        env:
          BOIDBOARD_REQUIRE_STOCKFISH: "1"
        run: cargo test --workspace --locked
