name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Deliberately NOT cancel-in-progress: a superseded run is still the only record that a
  # given commit was red or green, and this project treats that record as evidence.
  # (Note: pushing several commits at once produces one run for the pushed head, not one
  # per commit, so the ladder's per-commit reds are evidenced by re-running each RED commit
  # in a worktree rather than by CI history.)
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # AC1 command 1 of 3, plus AC1 command 2 of 3.
  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Turns "stockfish missing -> silently skip" into "stockfish missing -> fail".
      # Without this the differential coverage could evaporate on the runner unnoticed.
      BOIDBOARD_REQUIRE_STOCKFISH: "1"
    steps:
      - uses: actions/checkout@v4
      # Toolchain BEFORE the cache action: rust-cache computes its key from `rustc -vV`,
      # which is itself what triggers the rustup download for the pinned version. Ordered
      # the other way round, the retry script sits downstream of the step that actually
      # fails -- which is exactly how CI run 1 died ("Command failed: rustc -vV").
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - name: Install Stockfish
        run: ./scripts/setup-stockfish.sh
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        run: cargo test --workspace

  # AC1 command 3 of 3, verbatim. --all-targets is load-bearing: without it, clippy does
  # not lint test code at all, and the command becomes a near-no-op for this repository.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Toolchain BEFORE the cache action: rust-cache computes its key from `rustc -vV`,
      # which is itself what triggers the rustup download for the pinned version. Ordered
      # the other way round, the retry script sits downstream of the step that actually
      # fails -- which is exactly how CI run 1 died ("Command failed: rustc -vV").
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # `cargo fmt` without --check rewrites files and exits 0 unconditionally: it can never
  # fail. The issue says "CI running fmt" without specifying; this is the only reading
  # under which the job means anything (the issue is silent on which fmt invocation it means; this is the only
  # reading under which the job can ever fail).
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - run: cargo fmt --all -- --check

  # Separate from the AC1 commands, which are kept byte-identical to the issue's text.
  # This is what actually proves Cargo.lock is honoured (D-0013).
  locked:
    name: locked build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Toolchain BEFORE the cache action: rust-cache computes its key from `rustc -vV`,
      # which is itself what triggers the rustup download for the pinned version. Ordered
      # the other way round, the retry script sits downstream of the step that actually
      # fails -- which is exactly how CI run 1 died ("Command failed: rustc -vV").
      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  # Git- and repository-shape assertions. Deliberately a shell job, not a cargo test:
  # a git-dependent cargo test either fails under actions/checkout's default shallow
  # clone, or worse, passes vacuously behind a "no git metadata, return early" guard.
  repo-invariants:
    name: repo invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pinned toolchain
        run: ./scripts/setup-toolchain.sh

      - name: Workspace members are exactly the seven crates issue #3 names
        run: |
          set -euo pipefail
          got=$(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[].name' | sort | tr '\n' ' ')
          want="boid-board boid-eval-boids boid-eval-classical boid-search boid-tune boid-uci boid-web "
          echo "got:  $got"
          echo "want: $want"
          [ "$got" = "$want" ]

      - name: Intra-workspace dependency edges match the declared DAG
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[] as $p
            | $p.dependencies[]
            | select(.path != null)
            | select(.kind == null)
            | "\($p.name) -> \(.name)"
          ' | sort -u > /tmp/actual-edges.txt
          # Strip the comment header before comparing; only edges are data.
          grep -vE '^\s*(#|$)' .github/expected-dep-edges.txt | sort -u > /tmp/expected-edges.txt
          echo "--- actual ---"; cat /tmp/actual-edges.txt
          diff -u /tmp/expected-edges.txt /tmp/actual-edges.txt

      - name: boid-search must never depend on a concrete evaluator (D-0010)
        run: |
          set -euo pipefail
          if grep -qE '^boid-search -> boid-eval' /tmp/actual-edges.txt; then
            echo "D-0010 violated: boid-search depends on a concrete evaluator."
            echo "Evaluator selection is a runtime UCI option, not a build-time edge."
            exit 1
          fi

      - name: No .rs files under the repository-root tests/ directory (D-0007)
        run: |
          set -euo pipefail
          # A virtual workspace has no root package, so Cargo never compiles this
          # directory. Code placed here would silently never run.
          found=$(find tests -name '*.rs' -type f 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Found .rs files under the root tests/ directory; they will never be compiled:"
            echo "$found"
            exit 1
          fi

      - name: No self-authored acceptance-criteria document (D-0002)
        run: |
          set -euo pipefail
          # Repository-wide, not just docs/: the rule is about the document existing at
          # all, and confining the search to one directory made it trivially evadable.
          found=$(git ls-files | grep -iE '(^|/)(accept|criteria)[^/]*$' || true)
          if [ -n "$found" ]; then
            echo "D-0002 violated: this project may not author its own acceptance criteria"
            echo "in-repo until the perft harness is green. Found:"
            echo "$found"
            exit 1
          fi

      - name: Perft oracle fixture is ASCII-only (D-0008)
        run: |
          set -euo pipefail
          # Existence first: `grep` on a missing file returns non-zero, which this check
          # would otherwise read as "no non-ASCII bytes found" and pass vacuously.
          test -f tests/fixtures/perft_oracle.txt
          # Six of the seven published FENs use U+00A0. Stockfish's tokeniser is ASCII-only
          # and silently mis-parses those into a different position reporting 0 nodes.
          if LC_ALL=C grep -nP '[^\x00-\x7F]' tests/fixtures/perft_oracle.txt; then
            echo "Non-ASCII byte in the perft oracle fixture (see D-0008)."
            exit 1
          fi
          echo "fixture is ASCII-only"

      - name: gitignore patterns are root-anchored (D-0005)
        run: |
          set -euo pipefail
          # Behavioural, not textual: the textual half is a cargo test. A trailing slash
          # alone restricts a pattern to directories but not to the root, so "target/"
          # would still shadow a source path. Only the leading slash does that.
          git check-ignore -q target/debug/x \
            || { echo "target/debug/x should be ignored"; exit 1; }
          for src in crates/boid-board/src/target/mod.rs docs/debug/notes.md; do
            if git check-ignore -q "$src"; then
              echo "gitignore is shadowing the source path $src"
              exit 1
            fi
          done
          echo "build-artifact patterns are root-anchored"

      - name: Cargo.lock is tracked (D-0013)
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock >/dev/null
          # Assert the VERSIONS, not just the names: a name-only check passes for any
          # resolution inside the caret range, which is precisely what the lockfile exists
          # to nail down (D-0013).
          grep -A1 'name = "autumn-web"'     Cargo.lock | grep -q 'version = "0.6.'
          grep -A1 'name = "autumn-harvest"' Cargo.lock | grep -q 'version = "0.5.'
          echo "Cargo.lock is tracked and pins autumn-web 0.6.x / autumn-harvest 0.5.x"

      - name: Zobrist table matches its independent Python derivation (D-0024)
        run: |
          set -euo pipefail
          # scripts/zobrist-reference.py was written from docs/DECISIONS.md D-0018/D-0024,
          # not from src/zobrist.rs, and its digest was computed BEFORE the Rust constant
          # was pinned. This step keeps the two derivations tied together.
          command -v python3 >/dev/null || { echo "python3 is required"; exit 1; }
          derived=$(./scripts/zobrist-reference.py)
          pinned=$(grep -oE '"[0-9a-f]{64}"' crates/boid-board/tests/zobrist_digest.rs \
                   | head -1 | tr -d '"')
          # An empty pinned value would make the comparison vacuously pass on a rename.
          [ -n "$pinned" ] || { echo "no pinned digest found in zobrist_digest.rs"; exit 1; }
          echo "python: $derived"
          echo "pinned: $pinned"
          [ "$derived" = "$pinned" ]

      - name: No attack tables or move generation until issue #5 (D-0023)
        run: |
          set -euo pipefail
          # The #4/#5 seam, mechanically. Move APPLICATION needs no attack tables; move
          # GENERATION and LEGALITY need nothing else. If a function matching these names
          # appears before issue #5, the seam has moved and the decision log is stale.
          if git grep -nE 'fn +(attackers_to|is_square_attacked|is_check|generate_[a-z_]*moves)' \
               -- 'crates/*/src/*'; then
            echo "D-0023 violated: attack or generation code landed before issue #5."
            exit 1
          fi
          echo "no attack tables or move generation present"

      - name: No unmake_move in the public API (issue #4 AC7)
        run: |
          set -euo pipefail
          # Scoped to src/ deliberately. tests/board_layout.rs DEFINES these names in a
          # blanket trait so that an inherent method would shadow them -- that test is how
          # AC7 is proved, not a violation of it.
          if git grep -nE 'fn +(unmake|unapply|undo|take_back)_?move' -- 'crates/*/src/*'; then
            echo "AC7 violated: Board is Copy and must have no undo entry point."
            exit 1
          fi
          echo "no unmake_move present"

      - name: Every test the decision log cites resolves to a test that exists (D-0028)
        run: |
          set -euo pipefail
          # Four Evidence citations in docs/DECISIONS.md named tests that did not exist --
          # they had been renamed and the log was not. A citation nobody resolves is worse
          # than no citation, because a reader trusts it.
          missing=0
          # Only file::test_name shapes, where the file half matches a real test file.
          refs=$(grep -oE '\b[a-z_][a-z0-9_]*::[a-z_][a-z0-9_]*\b' docs/DECISIONS.md | sort -u)
          for ref in $refs; do
            file="${ref%%::*}"
            name="${ref##*::}"
            [ -f "crates/boid-board/tests/${file}.rs" ] || continue
            if ! grep -rq "fn ${name}\b" "crates/boid-board/tests/${file}.rs"; then
              echo "UNRESOLVED: docs/DECISIONS.md cites ${ref}, which does not exist"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "every cited test resolves"

      - name: Anti-theatre scan
        run: |
          set -euo pipefail
          # Prove the scanner can fail before trusting it to say the tree is clean. A
          # scanner nobody has seen fire is indistinguishable from one that matches
          # nothing -- and the self-test caught a real hole in this very script.
          ./scripts/anti-theatre.sh --selftest
          ./scripts/anti-theatre.sh

      - name: Quarantine — no archived code may re-enter the tree (D-0001)
        run: |
          set -euo pipefail
          ARCHIVED=a1f70323c6d56629a18e959894f0815efa0d3ac9

          # Keyed on the COMMIT, not the tag, so enforcement does not depend on a tag push.
          if ! git cat-file -e "$ARCHIVED^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$ARCHIVED" || true
          fi
          if ! git cat-file -e "$ARCHIVED^{commit}" 2>/dev/null; then
            echo "Archived commit $ARCHIVED unavailable on this runner; cannot verify."
            exit 1
          fi

          if git merge-base --is-ancestor "$ARCHIVED" HEAD; then
            echo "D-0001 violated: the archived attempt is an ancestor of HEAD."
            exit 1
          fi

          # No byte-identical blob may be copied out of the archived tree. LICENSE is the
          # sole allowance: it is unchanged from this repository's initial commit and
          # predates the attempt.
          git ls-tree -r HEAD       | awk '{print $3}' | sort -u > /tmp/head-blobs.txt
          git ls-tree -r "$ARCHIVED"| awk '{print $3}' | sort -u > /tmp/arch-blobs.txt
          license=$(git rev-parse HEAD:LICENSE)
          shared=$(comm -12 /tmp/head-blobs.txt /tmp/arch-blobs.txt | grep -vxF "$license" || true)
          if [ -n "$shared" ]; then
            echo "D-0001 violated: blobs shared with the archived tree:"
            for b in $shared; do echo "  $b"; git ls-tree -r HEAD | grep "$b" || true; done
            exit 1
          fi
          echo "quarantine intact: no shared blobs, not an ancestor"

      - name: Archive tag points at the archived commit (AC4)
        run: |
          set -euo pipefail
          ARCHIVED=a1f70323c6d56629a18e959894f0815efa0d3ac9
          if git rev-parse -q --verify refs/tags/archive/boids-sim-attempt >/dev/null; then
            got=$(git rev-parse 'refs/tags/archive/boids-sim-attempt^{commit}')
            echo "tag -> $got"
            [ "$got" = "$ARCHIVED" ] || { echo "Tag points at the wrong commit."; exit 1; }
            echo "AC4 satisfied: archive/boids-sim-attempt -> $ARCHIVED"
          else
            echo "::warning title=AC4 pending::refs/tags/archive/boids-sim-attempt is not on"
            echo "origin. The session that created this branch could not push tags (HTTP 403;"
            echo "its credential is scoped to refs/heads/*). The annotated tag was created"
            echo "locally and must be pushed by a maintainer:"
            echo "  git tag -a archive/boids-sim-attempt $ARCHIVED -m 'Quarantine: prior attempt (PR #2)'"
            echo "  git push origin archive/boids-sim-attempt"
            echo "This step will enforce the tag's target automatically once it exists."
          fi
