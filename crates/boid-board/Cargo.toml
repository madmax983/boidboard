[package]
name         = "boid-board"
description  = "Board representation, move generation, and the perft oracle."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

# Zero external dependencies, deliberately: this is the dependency root of the whole
# workspace and it should compile in well under a second, forever. See D-0014. That claim
# is about `[dependencies]` and stays exactly true -- `cargo build --workspace` compiles
# nothing from crates.io for this crate.
[dependencies]

# Issue #4 acceptance criterion 1 names proptest by name. It is a DEV-dependency, so it is
# absent from `cargo build` and from the dependency DAG the repo-invariants job diffs
# (which filters to normal dependencies); only `cargo test` pays for it. Default features
# are off: they pull rusty-fork, tempfile, rustix and wait-timeout for a fork-and-timeout
# harness this crate does not use, and turning them off drops the transitive tree from 39
# crates to 18. See D-0025.
[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }

[lints]
workspace = true
