[package]
name         = "boid-board"
description  = "Board representation, move generation, and the perft oracle."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

# Zero external dependencies, deliberately: this is the dependency root of the whole
# workspace and it should compile in well under a second, forever. See D-0014.
[dependencies]

# The one dev-dependency, named by issue #4's AC1 (D-0026). Dev-dependencies do not
# propagate to dependents and `cargo build --workspace` compiles none of this, so the
# zero-dependency stance above is narrowed rather than broken. default-features = false
# drops `fork` and `timeout`, which re-exec the test binary -- unwanted next to this
# crate's own two-process determinism check -- and are unnecessary for a crate that
# denies unsafe code and so has no segfaults to survive.
[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }

[lints]
workspace = true
