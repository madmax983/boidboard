[workspace]
members = ["boids-core", "boidboard"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/madmax983/boidboard"

[workspace.dependencies]
autumn-web = "0.6.0"
autumn-harvest = "0.5.0"
autumn-harvest-plugin = "0.5.0"
autumn-harvest-macros = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres"] }
diesel_migrations = "2"
pq-sys = { version = "0.7", features = ["bundled_without_openssl"] }
maud = { version = "0.27", features = ["axum"] }

[profile.test]
debug = "line-tables-only"
incremental = false
